# Minimal Alembic configuration, and minimal on purpose.
#
# This repository has NO assembly. It composes exactly two lineages — the
# kernel's and this module's — and both live in INSTALLED packages rather than
# in this tree, so `version_locations` is not written here at all: the platform
# canary sets it at runtime from `versions_dir()` on each package. Hard-coding
# site-packages paths into a checked-in file would break the moment the
# interpreter or the virtualenv location changed.
#
# `alembic/versions` stays empty and is not a lineage. It exists because Alembic
# requires `script_location` to be a real directory with a `versions` child, and
# a repository-owned migration here would be a third lineage this repository has
# no authority to create: `mod_deploy` is allocated to the module in the
# KERNEL's `MIGRATION_OWNER_LEDGER`, and `public` belongs to a host assembly.
[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
