composition_boundary = "ADR-0024 / hard rule 28: the module emits a provider-neutral DeliveryIntent and the Integrator owns transport, provider clients, credentials, webhook verification, connector retry and checkpoint state. There is no HTTP library, no provider client and no endpoint column anywhere in the package. ADR-0007: signature and possession verification are the KERNEL's; the caller runs verify_applied_state / verify_possession and passes the result in, so there is no second verifier that could disagree with the first. ADR-0026 s6: approvals decide approval and this module performs its own transition; ApprovalEvidence arrives as a VALUE through the assembly and no sibling is imported. ADR-0006 D1: no foreign key leaves mod_deploy; release_ref, licence_ref and brand_profile_ref are opaque and unconstrained. ADR-0023 / ADR-0057 s7: platform plane only, for a reason close to tautological - a module that decides what a FLEET should run cannot live inside one of the deployments it decides about. Ruling A4: this module holds no health status; whether a deployment is UP belongs to Dotmac Observability, and keeping them apart is what makes `no mutating consumer of health` a checkable dependency direction."
inventory_evidence = [
  "docs/inventories/vendor-cp-gap-sources.md",
  "docs/adr/0057-the-vendor-control-plane-composes-existing-owners.md",
]
source_mode_note = "greenfield-after-inventory, not product-first, and the distinction is the whole point of rule 24: a qualifying source must be PRODUCTION-USED. The Vendor V6 slices named in source_paths are a tested REFERENCE - never merged, never deployed, and their migration slots since reused by different work on Vendor main - so they cannot qualify however good they are, and the receipt half of this module is a port of a reference rather than an extraction of a production implementation. The plan/rollout half has no source at all, evidenced across every branch, stash, dangling object and reflog of the Vendor repository plus seven others. Both halves are therefore greenfield under rule 24, taken after the inventory that proves it."
first_cutover = "Not started, and this module's path to adoption is different from its two siblings'. There is nothing in Vendor production to cut over FROM: the V6 slices were never merged and never deployed, and their migration slots v011/v012 were subsequently reused by different work on Vendor main - which is positive evidence the line was abandoned rather than merely pending. So the first cutover is a greenfield composition rather than an authority transfer: Vendor exact-pins the module, installs the dc lineage, writes the assembly adapter, and registers its existing deployment targets. No legacy table is drained because none exists."
shadow_and_drift = "No shadow phase and no data-bearing migration are owed, and the reason is measurable rather than convenient: the capability has never run anywhere, so there is no second writer to reconcile against, no parallel evaluator to compare, and no rows to preserve. What IS owed at composition is the pair of proofs the source design earned and this port must not lose. (1) The claim/proof separation must hold against RAW SQL, not only against the service: the two CHECK constraints are declared on both the model and the migration, and the Postgres canary proves an insert claiming an authenticated identity without a valid signature is refused. (2) The stable-verdict rule must hold under concurrency: two simultaneous arrivals under one idempotency key must produce one canonical receipt and one loser pointing at it, never two receipts or a re-decided verdict. The V6 source shipped a concurrency rehearsal for exactly this and it is preserved as a named obligation on the Vendor composition, because a single-process test cannot establish it."
local_copy_retirement = "Nothing to retire in any product: the V6 slices were never merged. The obligation runs the other way - the branches feat/v6-slice1-deployment-credentials and feat/v6-slice2-applied-state-admission must be DELETED from dotmac_vendor_control_plane once this module is composed, so that no future reader mistakes an abandoned line for a second implementation of a capability that now has an owner. Their migration slots are already reused on main, so leaving them is also a live rebase hazard."
next_action = "dotmac-deployment-control 0.1.0a2 is published, installed back from the private index, conformance-checked and tagged from exact protected-main SHA 5c87272a by release run 32471956734. a2 is the first admissible composition version: a1 published the stable-verdict contract but did not recover the losing first-arrival transaction after the receipt unique constraint selected a winner, so Vendor must exact-pin a2 rather than a1. Publication moved no authority. Still owed, unchanged by the release: compose in the vendor control plane by exact-pinning dotmac-deployment-control 0.1.0a2 and dotmac-kernel 0.1.0a77, install the dc lineage with its prerequisite bindings, write the assembly adapter that runs dotmac_kernel.licensing.verify_applied_state and hands the result in as an ObservedState, wire the DeliveryIntent to the Integrator, register existing targets, re-run the deterministic concurrency rehearsal named in shadow_and_drift against the Vendor composition, and delete the two abandoned V6 branches in the same change. Until then this package is built, validated and published but unadopted, and must not be described as in production."

