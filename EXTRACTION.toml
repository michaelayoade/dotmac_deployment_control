schema_version = 1
package = "dotmac-deployment-control"
classification = "optional-module"
status = "adopted"
source_mode = "greenfield-after-inventory"
owner = "Desired deployment intent for licensed Dotmac application deployments: the target and its identity credentials, the immutable approved plan, the rollout decision and its attempts, the authenticated acknowledgements a target reports, and the drift between what was rolled out and what is observed"
contract = "Register a deployment target with an opaque subject, product, environment and stable target reference; declare a versioned desired specification with opaque release, licence and brand-profile references; enrol a target's own typed PUBLIC verification identity - exact key bytes, algorithm, target-observation purpose and internally-derived fingerprint - as PENDING and admit it only after the caller proves possession through the kernel (ADR-0007); freeze the current desired state into an immutable plan with a SHA-256 digest, superseding any earlier undecided plan; require ApprovalEvidence whose content_digest equals the plan digest for a plan declared sensitive; request a rollout only against an approved-or-exempt plan and an active target; issue a purpose-bound portable authorization whose signed bytes carry Control's internally-derived installed version and a per-target execution sequence; open attempts one at a time and return a provider-neutral DeliveryIntent carrying WHAT to deploy and never HOW; settle an attempt without failing the rollout, so a transient transport error is not a deployment decision; distinguish timed-out from failed and manual-repair from cancelled; require a separate purpose-bound target execution envelope that signs the digest and identity of the exact authorization, rollout sequence and attempt, target, operation, release and exact images, plan/descriptor/execution-plan digests, observed revision/runtime/outcome and time; verify that envelope against the exact enrolled public identity and its still-standing authorization before any observed state changes; derive the proven target from that credential and require every caller projection to equal the signed statement; retain every arrival, and make the first eligible verified attributable envelope canonical even when quarantined, returning its original verdict for exact-byte replay and conflicting on the same report id with different bytes; advance each target only monotonically by signed rollout sequence and attempt, retaining stale and conflicting coordinates without regressing newer state; keep transport settlement separate from execution observation; keep the proven identity in a different column from the reported claim under a CHECK; attribute an observed desired revision only to the exact authorized plan and only when the observed spec digest matches that plan's frozen spec; compute drift on demand against the plan that was actually rolled out; freeze a DECLARED authorized image set inside the very document the plan digest is taken over, so an approval that binds the digest binds the images and an image cannot change without the digest changing; record whether an approval still STANDS, separately from the plan status that records it once was, and refuse a rollout of a plan whose decision was revoked; and answer a READ-ONLY approved-plan lookup by plan digest that returns the frozen authorization - execution plan digest, operation, policy identity and version, decision reference and standing, Control version and the authorized image set - or exactly one typed refusal a caller cannot mistake for an approval, revocation included, deriving and recomputing nothing. NOT provider credentials, provider clients, webhook verification, connector retry or checkpoint state, the release catalogue, licence authority, brand definition, application-domain migrations, billing/entitlement/support decisions, or general infrastructure observability."
