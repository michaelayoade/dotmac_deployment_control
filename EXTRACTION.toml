adoption_evidence_schema = "v1"
composition_boundary = "ADR-0024 / hard rule 28: the module emits a provider-neutral DeliveryIntent and the Integrator owns transport, provider clients, credentials, webhook verification, connector retry and checkpoint state. There is no HTTP library, no provider client and no endpoint column anywhere in the package. ADR-0007: kernel possession proof gates activation of a target public credential. Control owns the provider-neutral canonical execution-observation statement and verifies it through an injected purpose-specific verifier before state changes; Control owns no private key or crypto provider, and the target-observation purpose is structurally separate from the authorization-signing purpose. ADR-0026 s6: approvals decide approval and this module performs its own transition; ApprovalEvidence arrives as a VALUE through the assembly and no sibling is imported. ADR-0006 D1: no foreign key leaves mod_deploy; release_ref, licence_ref and brand_profile_ref are opaque and unconstrained. ADR-0023 / ADR-0057 s7: platform plane only, for a reason close to tautological - a module that decides what a FLEET should run cannot live inside one of the deployments it decides about. Ruling A4: this module holds no health status; whether a deployment is UP belongs to Dotmac Observability, and keeping them apart is what makes `no mutating consumer of health` a checkable dependency direction."
inventory_evidence = [
  "docs/inventories/vendor-cp-gap-sources.md",
  "docs/adr/0057-the-vendor-control-plane-composes-existing-owners.md",
]
source_mode_note = "greenfield-after-inventory, not product-first, and the distinction is the whole point of rule 24: a qualifying source must be PRODUCTION-USED. The Vendor V6 slices named in source_paths are a tested REFERENCE - never merged, never deployed, and their migration slots since reused by different work on Vendor main - so they cannot qualify however good they are, and the receipt half of this module is a port of a reference rather than an extraction of a production implementation. The plan/rollout half has no source at all, evidenced across every branch, stash, dangling object and reflog of the Vendor repository plus seven others. Both halves are therefore greenfield under rule 24, taken after the inventory that proves it."
first_cutover = "COMPLETE, and this dossier previously said the opposite. dotmac_vendor_control_plane composed the module on 2026-08-21 in merge 69a877d6f0c6886e300f5433020f7f25421e111c ('Compose Deployment Control, and cut target authority over to it', #71): it exact-pins 0.1.0a2 from the private index with the wheel and sdist hashes locked, registers the manifest in STATEFUL_MODULES, composes the dc lineage into composed_version_locations, and v017 sealed the independent deployment-target registration path so vendor_cp.deployment.adapter is the only seam. It was a greenfield composition rather than an authority transfer for plans, rollouts, credentials and observations - no revision in this lineage ever created one - and an authority cutover for the deployment-TARGET half alone. No legacy table was drained because none existed. WHAT IS NOT CLAIMED: that Vendor PRODUCTION runs this. Composition is a fact about Vendor's main branch, established by parsing its assembly and migration modules at that commit. A production claim needs a deployment_run oracle with immutable coordinates (Governance ADR 0013) and no such oracle exists, so none is cited."
shadow_and_drift = "No shadow phase and no data-bearing migration are owed, and the reason is measurable rather than convenient: the capability has never run anywhere, so there is no second writer to reconcile against, no parallel evaluator to compare, and no rows to preserve. What IS owed at composition is the pair of proofs the source design earned and this port must not lose. (1) The claim/proof separation must hold against RAW SQL, not only against the service: the two CHECK constraints are declared on both the model and the migration, and the Postgres canary proves an insert claiming an authenticated identity without a valid signature is refused. (2) The stable-verdict rule must hold under concurrency: two simultaneous arrivals under one idempotency key must produce one canonical receipt and one loser pointing at it, never two receipts or a re-decided verdict. The V6 source shipped a concurrency rehearsal for exactly this and it is preserved as a named obligation on the Vendor composition, because a single-process test cannot establish it."
local_copy_retirement = "Nothing to retire in any product: the V6 slices were never merged. The obligation runs the other way - the branches feat/v6-slice1-deployment-credentials and feat/v6-slice2-applied-state-admission must be DELETED from dotmac_vendor_control_plane once this module is composed, so that no future reader mistakes an abandoned line for a second implementation of a capability that now has an owner. Their migration slots are already reused on main, so leaving them is also a live rebase hazard."
next_action = "dotmac-deployment-control 0.1.0a2 is published, installed back from the private index, conformance-checked and tagged from exact protected-main SHA 5c87272a by release run 32471956734; a1 peels to fead57bc93d6551450f5e6ae1c9de1296e27b0ae and a2 to 5c87272a632096850a80e5e9dc1f625a97c3e5d6. Composition is done (see first_cutover). Two obligations remain from that composition and neither is discharged by it: re-run the deterministic concurrency rehearsal named in shadow_and_drift against the Vendor composition, and delete the abandoned V6 branches feat/v6-slice1-deployment-credentials and feat/v6-slice2-applied-state-admission from dotmac_vendor_control_plane so no future reader mistakes an abandoned line for a second implementation. Separately, Michael ruled on 2026-08-29 that this package MOVES to its own repository, dotmac_deployment_control: the distribution name, public API and history are preserved, the Starter copy is frozen by removing its .github/release-modules.json row, and exactly one repository publishes afterwards. The released a1/a2 tags stay here permanently because git filter-repo rewrites SHAs and a tag on a rewritten commit would make one published version name two trees. Until the move completes this package is published, composed by one consumer, and not proven in any production system."

# ── Adoption evidence ───────────────────────────────────────────────────────
#
# Three rows, one tree. The pin says Vendor INSTALLED the module; the two
# `composed_at` rows say Vendor COMPOSED it. A pin is installation, not
# adoption, and neither composition row is adoption on its own either: a
# registered manifest whose lineage is not composed installs tables nobody
# migrates, and a composed lineage with no registered manifest migrates tables
# nothing registers. All three are read from ONE commit, because a roster entry
# at one commit beside a pin at another is two true facts arranged to look like
# one.
#
# The commit is the merge that did it: "Compose Deployment Control, and cut
# target authority over to it (#71)", 2026-08-21.

