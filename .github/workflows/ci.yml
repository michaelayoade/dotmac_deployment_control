name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
  POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}

jobs:
  # ── The credential is checked for the PROPERTY, not for existence ──────────
  #
  # This job carries NO `if:`. That is the whole point. `if: secrets.X != ''`
  # would SKIP when the credential is missing, and a skipped job is not a failed
  # job — the pull request would go green having installed and proven nothing.
  # An absent credential must be red and loud.
  #
  # And it does not merely test that a string is non-empty. `AGENTS.md` rule 39:
  # a step is renamed if it does not test the property it is named for, and
  # presence is not the property. The property is *this credential can resolve
  # the dependency this repository cannot build without*, so the job asks the
  # index for `dotmac-kernel` and requires a 200.
  credential:
    name: forgejo read credential resolves dotmac-kernel
    runs-on: ubuntu-latest
    steps:
      # Checked out for ONE file: `scripts/curl_with_credential.sh`. This job
      # needed no working tree while it authenticated with `curl -u`, and that
      # form is precisely what put the credential in the process arguments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse to continue without a usable read credential
        env:
          TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
          # By ENVIRONMENT, never on a command line. The helper reads it from
          # here and writes it into a 0600 config file whose PATH is the only
          # thing curl's argv ever holds.
          CURL_CREDENTIAL_USER: ci-reader
          CURL_CREDENTIAL_SECRET: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::FORGEJO_READ_TOKEN is not set on this repository."
            echo "This repository depends on dotmac-kernel from the private index"
            echo "and cannot build, test or type-check without it. The credential"
            echo "is a repository secret; its value lives in OpenBao and is never"
            echo "recorded here. This job fails rather than skipping, because a"
            echo "skipped job reads as success."
            exit 1
          fi
          code=$(bash scripts/curl_with_credential.sh basic \
            -sS -o /dev/null -w '%{http_code}' \
            "https://registry.dotmac.io/api/packages/dotmac/pypi/simple/dotmac-kernel/" || echo 000)
          if [ "${code}" != "200" ]; then
            echo "::error::the credential exists but cannot read dotmac-kernel (HTTP ${code})."
            echo "Presence is not the property. A token that is set, valid, and"
            echo "scoped to the wrong thing fails here, which is the case worth"
            echo "catching."
            exit 1
          fi
          echo "ci-reader can resolve dotmac-kernel from the private index."

  lint:
    name: ruff
    runs-on: ubuntu-latest
    # Deliberately independent of the credential: linting needs no dependency
    # resolution, so it must keep working and keep reporting while the index
    # credential is being provisioned.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.6.9
      - run: ruff check .
      - run: ruff format --check .

  unit:
    name: unit + architecture (SQLite)
    needs: credential
    runs-on: ubuntu-latest
    steps:
      # `fetch-tags: true` is load-bearing, not tidiness.
      #
      # `test_ported_gate_declared_publication.py` decides whether a declared
      # version is published by asking `git tag --list`. The default checkout
      # fetches no tags, so that question had exactly one possible answer here:
      # none. The gate's two-directional ratchet — the half that catches a
      # ledger row outliving its own publication — was therefore unable to fire
      # at all, and it did not fire when `0.1.0a4` was tagged while the ledger
      # still called it `never-published`.
      #
      # A guard that cannot observe the thing it rules on is not a lenient
      # guard, it is an absent one. `test_a_tag_this_repository_published_is_
      # visible_to_the_gate` fails if this line is removed, so the blindness
      # cannot come back silently.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction
      - run: poetry run pytest tests/unit tests/architecture

  type-check:
    name: mypy
    needs: credential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction
      - run: poetry run mypy src/dotmac_deployment_control

  # ── The canaries run against a BUILT WHEEL, never against `src/` ──────────
  #
  # `0.1.0a4` published a wheel whose `__version__` said `0.1.0a2`. Every check
  # that could have caught it was reading the source tree, where the two
  # literals were equally wrong and equally invisible. A proof about an
  # ARTIFACT has to execute the artifact, so this job builds one, installs it
  # into a clean virtualenv with its real dependency graph, and runs
  # `scripts/artifact_canaries.py` with THAT interpreter.
  #
  # The first canary refuses to continue unless the module it imported came out
  # of the venv's site-packages, so the job cannot silently degrade into a
  # slower copy of the `unit` lane if the path ever changes.
  #
  # This is pre-merge, on the built wheel. `verify-release.yml` runs the SAME
  # script against the wheel the REGISTRY served, which is a different and
  # stronger claim; neither replaces the other, because a wheel that is correct
  # on a runner and a wheel that is correct on the index are two facts.
  artifact-canaries:
    name: behavioural canaries (installed wheel)
    needs: credential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pipx install poetry==1.8.3
      - name: Build the artifact the canaries will be run against
        run: poetry build
      - name: Install that wheel, with its dependencies, into a clean environment
        env:
          TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          # THE TRAP, not a trailing `rm`: a removal on the last line runs only
          # when every line before it succeeded, and `set -e` makes
          # not-succeeding the common case. Same rule the verify workflow's
          # consumer step is held to.
          trap 'rm -f -- "${HOME}/.netrc"' EXIT HUP INT TERM
          umask 077
          : > "${HOME}/.netrc"
          chmod 600 "${HOME}/.netrc"
          printf 'machine %s login %s password %s\n' \
            "registry.dotmac.io" "ci-reader" "${TOKEN}" >> "${HOME}/.netrc"
          python -m venv /tmp/canary
          /tmp/canary/bin/pip install --quiet --upgrade pip
          # PyPI primary, the private index EXTRA, so a public name cannot be
          # shadowed by a private one. `.netrc` is host-scoped, so the
          # credential is only ever offered to registry.dotmac.io.
          /tmp/canary/bin/pip install --quiet \
            --index-url "https://pypi.org/simple" \
            --extra-index-url "https://registry.dotmac.io/api/packages/dotmac/pypi/simple" \
            dist/*.whl
      - name: Run the canaries with the installed environment's interpreter
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['tool']['poetry']['version'])")
          echo "declared version: ${VERSION}"
          # The repository is NOT on this interpreter's path: `sys.path[0]` is
          # `scripts/`, and the package lives under `src/`. The first canary
          # asserts that rather than trusting it.
          /tmp/canary/bin/python scripts/artifact_canaries.py --expect-version "${VERSION}"

  # ── The reason this repository has a PostgreSQL lane at all ───────────────
  #
  # `tests/test_deployment_control_platform_isolation.py` is 1,001 lines proving
  # the claim/proof CHECK constraints hold against RAW SQL, and that the tenant
  # role holds zero grants on the platform plane. It cannot run on SQLite.
  #
  # `REQUIRE_NO_SKIPS=1` is not decoration. The canary calls `pytest.skip` when
  # `TEST_DATABASE_URL` is unset — correct in the monorepo it came from, and a
  # silent hole here, where this lane exists for this file. The conftest hook
  # turns a skip in this lane into a failure.
  postgres:
    name: platform isolation canary (PostgreSQL)
    needs: credential
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      REQUIRE_NO_SKIPS: "1"
      # A module lineage declares the effects it needs and never names a foreign
      # revision; the ASSEMBLY binds effect to revision. Dropping the assembly
      # lineage removed that answer too, so the kernel correctly refused with
      # `UnboundPrerequisiteError` rather than migrating into an unproven
      # database — the gate working, not a gate in the way.
      DOTMAC_MIGRATION_BINDINGS: tests.migration_bindings:CANARY_PREREQUISITE_BINDINGS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pipx install poetry==1.8.3
      - run: poetry install --no-interaction
      # PostgreSQL roles are CLUSTER-wide, not per-database, and that is the
      # whole of why this step needs more than three CREATE ROLEs.
      #
      # The canary builds a fresh scratch database and migrates it AS app_admin.
      # The kernel lineage creates `outbox_dispatcher` behind an IF NOT EXISTS.
      # In the repository this test came from that guard always found the role
      # already present, because a superuser had run the same lineage against
      # the shared test server earlier and the role outlived the database. Here
      # nothing has ever run it, so the guard falls through to CREATE ROLE and
      # app_admin is refused: "Only roles with the CREATEROLE attribute may
      # create roles."
      #
      # So app_admin is created the way the kernel's own `0001` creates it —
      # LOGIN BYPASSRLS — plus CREATEROLE, because here it is the role that
      # actually runs the lineage rather than one the lineage produced. In
      # PostgreSQL 16 a CREATEROLE role may only grant attributes it holds
      # itself, which is why BYPASSRLS is not optional for it.
      - name: Create the cluster roles the composed lineage expects
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE app_admin LOGIN BYPASSRLS CREATEROLE PASSWORD 'app_admin'"
          for role in app_user platform_api; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "CREATE ROLE ${role} LOGIN PASSWORD '${role}'"
          done

      # Explicit credentials for every role, NOT `POSTGRES_HOST_AUTH_METHOD=trust`.
      #
      # The canary builds each role's URL from the superuser one by swapping the
      # USER and dropping the password, so libpq must find the password
      # somewhere else. `.pgpass` is that somewhere, and choosing it over `trust`
      # is deliberate.
      #
      # `trust` would make these connections succeed by removing authentication
      # from the picture entirely — and this lane exists because 92 errors were
      # once authentication failures STANDING IN for a grant test that never
      # ran. Deleting authentication does not remove that substitution, it makes
      # the reverse one possible: a future auth regression would leave the grant
      # assertions passing and say nothing. With real passwords, a connection
      # that succeeds has PROVEN authentication before the test reaches the
      # question it is actually asking.
      #
      # The wildcard database field is required, not laziness: each canary
      # module creates a scratch database with a RANDOM name. A
      # database-specific entry would simply not match, libpq would fall back to
      # prompting, and the connection would fail for authentication reasons
      # inside a test asking about grants — the exact substitution removing
      # `trust` was meant to eliminate, reintroduced through the credential file.
      - name: Give each role a real password to authenticate with
        run: |
          set -euo pipefail
          umask 077
          {
            echo "localhost:5432:*:app_admin:app_admin"
            echo "localhost:5432:*:app_user:app_user"
            echo "localhost:5432:*:platform_api:platform_api"
          } > "$HOME/.pgpass"
          chmod 600 "$HOME/.pgpass"
      - run: poetry run pytest tests/test_deployment_control_platform_isolation.py -rs
