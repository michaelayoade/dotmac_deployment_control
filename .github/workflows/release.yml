name: Release

# Publishes `dotmac-deployment-control` to the private index. This is the ONLY
# path by which that distribution may be published, and the structure below is
# what makes that true rather than asserted.
#
# WHY THE STRUCTURE CARRIES THE RESTRICTION
#
# Forgejo packages belong to the OWNER, not to a repository. The publishing
# identity holds `write:package` through a team carrying only the packages unit,
# which stops it reaching any repository — but it cannot be narrowed to one
# PACKAGE NAME. Registry permission is owner/package-namespace scoped, so
# nothing on the Forgejo side prevents this credential publishing some other
# `dotmac` package. This workflow is the boundary, and
# `docs/CONTROL_EXCEPTIONS.md` records that plainly rather than implying the
# server enforces it.

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: >-
          Must be dotmac-deployment-control. An input rather than a constant so
          the refusal is DEMONSTRABLE: dispatching a foreign name produces a
          real refused run, which is the evidence that the boundary exists.
        required: true
        default: dotmac-deployment-control
      version:
        description: The version to publish. Must be strictly greater than the inherited floor.
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DISTRIBUTION: dotmac-deployment-control
  INDEX_HOST: registry.dotmac.io
  INDEX_UPLOAD: https://registry.dotmac.io/api/packages/dotmac/pypi
  INDEX_SIMPLE: https://registry.dotmac.io/api/packages/dotmac/pypi/simple

jobs:
  # ── 1. IDENTITY, unconditionally, before anything else ────────────────────
  #
  # No `if:`. Every other job `needs:` it. A secret-conditioned `if:` would SKIP
  # when the credential is missing, and a skipped job is not a failed job.
  #
  # It asserts BEHAVIOUR, never a scope string. During provisioning `read:package`
  # was normalised away by Forgejo (implied by `write:package`) and the token
  # still 401'd on the index; the actual cause was org TEAM MEMBERSHIP, which the
  # stored scope string says nothing about. So: the login must be exactly the
  # expected publisher, and a package-namespace read must return 200. Two
  # behaviours, both observable, neither inferable from configuration.
  preflight:
    name: publisher identity
    runs-on: ubuntu-latest
    environment: registry-release
    steps:
      # Checked out for ONE file: `scripts/curl_with_credential.sh`. Every
      # authenticated request below used to carry `-H "Authorization: token
      # ${TOKEN}"`, which places the credential in curl's ARGUMENT VECTOR just
      # as `-u` does. Same wire form now, from a 0600 config file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The authenticated identity must be the publisher, and it must reach packages
        env:
          TOKEN: ${{ secrets.FORGEJO_PUBLISH_TOKEN }}
          CURL_CREDENTIAL_SECRET: ${{ secrets.FORGEJO_PUBLISH_TOKEN }}
          EXPECTED_LOGIN: dotmac-deployment-control-publisher
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::FORGEJO_PUBLISH_TOKEN is absent from the registry-release environment."
            echo "This job fails rather than skipping: a skipped job reads as success."
            exit 1
          fi

          # Identity. Presence is not the property (AGENTS.md rule 39): a token
          # that is set, valid, and belongs to the Starter's publisher is exactly
          # the case worth catching, because it silently recreates the two-writer
          # hazard the extraction removed.
          login=$(bash scripts/curl_with_credential.sh token -sS \
            "https://${INDEX_HOST}/api/v1/user" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("login",""))')
          if [ "${login}" != "${EXPECTED_LOGIN}" ]; then
            echo "::error::authenticated as '${login}', expected '${EXPECTED_LOGIN}'."
            exit 1
          fi
          echo "identity: ${login}"

          # Package reach. Granted by team membership, not by the scope string.
          code=$(bash scripts/curl_with_credential.sh token \
            -sS -o /dev/null -w '%{http_code}' "${INDEX_SIMPLE}/${DISTRIBUTION}/")
          if [ "${code}" != "200" ] && [ "${code}" != "404" ]; then
            echo "::error::package-namespace read returned ${code}; the credential cannot reach the index."
            exit 1
          fi
          echo "package namespace reachable (HTTP ${code}; 404 is a first release)"

      # Acceptance 2, re-proven here rather than trusted from provisioning: this
      # credential must not read or mutate repositories. A publish token that can
      # reach source is a different blast radius than the one recorded.
      - name: The publisher must NOT be able to reach repositories
        env:
          CURL_CREDENTIAL_SECRET: ${{ secrets.FORGEJO_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          for path in "user/repos" "repos/dotmac/dotmac_deployment_control"; do
            code=$(bash scripts/curl_with_credential.sh token \
              -sS -o /dev/null -w '%{http_code}' "https://${INDEX_HOST}/api/v1/${path}")
            if [ "${code}" = "200" ]; then
              echo "::error::/api/v1/${path} returned 200 — this credential can reach repositories."
              exit 1
            fi
            echo "/api/v1/${path} -> ${code} (refused, as required)"
          done

  # ── 2. STRUCTURAL REFUSALS, before a build exists ─────────────────────────
  guard:
    name: refuse anything but this distribution above the floor
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: This run must be the exact current tip of protected main
        run: bash scripts/assert_current_main.sh "${GITHUB_SHA}"

      # Refuses a foreign distribution, a version at or below the inherited
      # floor, and a version shape it cannot order. BEFORE any build or upload,
      # which is the requirement: a foreign name must never reach a wheel.
      - name: Distribution and version
        run: |
          python scripts/release_guard.py \
            --distribution '${{ inputs.distribution }}' --version '${{ inputs.version }}'

      # The dispatch input and the tree must agree. Otherwise a correct-looking
      # dispatch could publish a pyproject that was renamed underneath it.
      - name: The tree must declare the same distribution and version
        id: decide
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import tomllib, os, sys
          p = tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]
          want_dist, want_ver = os.environ["IN_DIST"], os.environ["IN_VER"]
          if p["name"] != want_dist or p["version"] != want_ver:
              sys.exit(
                  f"::error::dispatch asked for {want_dist} {want_ver} but the tree "
                  f"declares {p['name']} {p['version']}"
              )
          print(f"tag=dotmac-deployment-control-v{want_ver}")
          PY
        env:
          IN_DIST: ${{ inputs.distribution }}
          IN_VER: ${{ inputs.version }}

      # IMMUTABLE CONFLICT REFUSAL, checked before building. The index refuses a
      # re-upload anyway, but failing here means a conflicting release never
      # reaches the credential at all — and the message says what happened
      # instead of surfacing as a transport error at upload time.
      - name: The version must not already exist on the index
        env:
          CURL_CREDENTIAL_USER: ci-reader
          CURL_CREDENTIAL_SECRET: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          body=$(bash scripts/curl_with_credential.sh basic -sS \
            "${INDEX_SIMPLE}/${DISTRIBUTION}/" || true)
          if printf '%s' "${body}" | grep -q -- "-${{ inputs.version }}[.-]"; then
            echo "::error::${DISTRIBUTION} ${{ inputs.version }} is already on the index."
            echo "A published version is immutable. Publish a new version; never overwrite."
            exit 1
          fi
          echo "${{ inputs.version }} is not yet on the index"

  build:
    needs: [preflight, guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.3
      - run: poetry build
      - name: Record the artifact hashes the independent verifier must reproduce
        run: |
          set -euo pipefail
          ( cd dist && sha256sum * | tee ../artifact-hashes.txt )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: |
            dist/*
            artifact-hashes.txt
          if-no-files-found: error

  publish:
    needs: [preflight, guard, build]
    runs-on: ubuntu-latest
    environment: registry-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Re-assert at the irreversible boundary. `guard` proved this run was
      # main's tip at dispatch; a queued publish can start after main moves.
      - name: Re-assert the run SHA is still the current protected main
        run: bash scripts/assert_current_main.sh "${GITHUB_SHA}"
      - name: Re-assert distribution and floor
        run: |
          python scripts/release_guard.py \
            --distribution '${{ inputs.distribution }}' --version '${{ inputs.version }}'

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist

      # THE PROPERTY: the credential is never part of a URL.
      #
      # Stated as the property rather than as a mechanism, because the mechanism
      # already moved once. This step first passed the credential through a
      # `.netrc`; current twine no longer reads one, so `--non-interactive`
      # found no username and refused — correctly, and before transferring a
      # byte. Naming `.netrc` here would have left a comment describing
      # something that no longer exists.
      #
      # What must stay true is that `https://user:token@host` never appears.
      # That shape leaks the instant anything echoes the command, and `set -x`,
      # a curl error and a pip resolver diagnostic all do. Environment variables
      # keep the credential out of the URL and out of the process arguments, and
      # Actions masks them — proven in the failed run above, where the env dump
      # showed `TOKEN: ***` while the step was failing.
      - name: Publish the exact built bytes
        env:
          TWINE_USERNAME: dotmac-deployment-control-publisher
          TWINE_PASSWORD: ${{ secrets.FORGEJO_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          # PINNED. An unpinned install is how the credential interface moved
          # under this workflow once already: twine dropped `.netrc` support
          # between runs and `--non-interactive` began refusing. Env-var auth
          # is stable across twine majors, but the pin is what makes a future
          # interface change a deliberate bump rather than a surprise.
          python -m pip install --quiet 'twine==6.1.0'
          # NO --skip-existing. It converts a conflicting upload into a silent
          # success, which is precisely the shape this repository refuses.
          python -m twine upload --non-interactive \
            --repository-url "${INDEX_UPLOAD}" dist/*

  # ── 5. READ-BACK ONLY. THIS RUN DOES NOT VERIFY ITSELF, AND DOES NOT TAG ──
  #
  # `0.1.0a4` was tagged by a job in THIS workflow that called itself a
  # verification and could not perform one. It compared hashes over whatever
  # `pip download` happened to retrieve — the wheel, never the sdist, which is
  # the exact gap that made a3 unprovable — and it swallowed the install result
  # with `|| true`, so "an ordinary consumer can install it" was a step name and
  # nothing more. Both defects went green.
  #
  # The structural repair is not a better check here. A publishing run that
  # verifies its own output is the wrong SHAPE for the claim: it holds the
  # publishing credential, it already has the bytes on disk, and it is the one
  # party that cannot be an independent witness to the registry. So this job
  # now asserts exactly one thing it is competent to assert — the upload landed
  # somewhere the index will list — and the tag, which is this repository's
  # assertion that a release was verified, is written only by
  # `verify-release.yml`, in a separate run, from evidence gathered afresh.
  #
  # `contents: write` is deliberately ABSENT. The permission a tag needs is the
  # permission this job must not hold.
  readback:
    name: the upload landed
    needs: [preflight, guard, build, publish]
    runs-on: ubuntu-latest
    environment: registry-release
    steps:
      # For `scripts/curl_with_credential.sh` only; this job builds nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the published version back as the publisher
        env:
          CURL_CREDENTIAL_SECRET: ${{ secrets.FORGEJO_PUBLISH_TOKEN }}
          VERSION: ${{ inputs.version }}
          # The read-back window, overridable per repository. The default is
          # fifteen minutes (60 x 15 s): 0.1.0a16's upload landed but the index
          # did not list it within the former fixed five minutes, so the run
          # reported a failed release for bytes the independent verifier then
          # proved. A liveness budget, not a correctness one: verify-release.yml
          # stays the only witness, and nothing here tags or records.
          READBACK_ATTEMPTS: ${{ vars.RELEASE_READBACK_ATTEMPTS || '60' }}
          READBACK_INTERVAL_SECONDS: ${{ vars.RELEASE_READBACK_INTERVAL_SECONDS || '15' }}
        run: |
          set -euo pipefail
          # Header auth, the same form the preflight already exercised against
          # this index in this workflow. No credential in the URL, and — since
          # the helper replaced `-H "Authorization: token ${TOKEN}"` — none in
          # curl's arguments either. This loop is the reason that mattered
          # most: it can hold a credential-bearing curl in the process table
          # for the whole read-back window.
          [[ "${READBACK_ATTEMPTS}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::READBACK_ATTEMPTS must be a positive integer"; exit 1; }
          [[ "${READBACK_INTERVAL_SECONDS}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::READBACK_INTERVAL_SECONDS must be a positive integer"; exit 1; }
          page="$(mktemp)"
          for i in $(seq 1 "${READBACK_ATTEMPTS}"); do
            # Each attempt says WHY it missed. An authentication refusal is a
            # credential problem, not index lag, and waiting fifteen minutes
            # on it would only hide that.
            # A transport failure is recorded as such and retried; it can
            # never count as a read-back, which needs HTTP 200 AND the version.
            if ! code="$(bash scripts/curl_with_credential.sh token -sS -o "${page}" \
                           -w '%{http_code}' -H 'Cache-Control: no-cache' \
                           "${INDEX_SIMPLE}/${DISTRIBUTION}/")"; then
              code="transport-error"
            fi
            case "${code}" in
              401|403)
                echo "::error::the publisher's read-back was refused (HTTP ${code}); this is a credential or scope problem, not index lag"
                exit 1 ;;
            esac
            if [ "${code}" = "200" ] && grep -q -- "-${VERSION}[.-]" "${page}"; then
              echo "publisher read-back: ${VERSION} is on the index (attempt ${i}, HTTP ${code})"; exit 0
            fi
            echo "not yet on the index (attempt ${i}/${READBACK_ATTEMPTS}, HTTP ${code})..."
            sleep "${READBACK_INTERVAL_SECONDS}"
          done
          echo "::error::${VERSION} did not appear on the index within ${READBACK_ATTEMPTS} x ${READBACK_INTERVAL_SECONDS}s. The upload may still have landed: dispatch verify-release.yml, the only witness, before concluding anything."
          exit 1

      # A published version with no tag and no ledger row is the state this
      # repository is designed to sit in until an independent witness speaks.
      # Saying so loudly is the point: silence here is how a4 acquired a tag
      # nobody had earned.
      - name: State what is now owed
        run: |
          echo "::notice::PUBLISHED, NOT YET VERIFIED, NOT YET TAGGED."
          echo "::notice::OWED 1: dispatch 'Verify release' with version=${{ inputs.version }} and release_run=${{ github.run_id }}."
          echo "::notice::OWED 2: only that run may write the tag, and only on a VERIFIED verdict."
          echo "::notice::OWED 3: record ${{ inputs.version }} in docs/published-versions.json and remove its docs/publication-ledger.json row."
