[tool.poetry]
name = "dotmac-deployment-control"
version = "0.1.0a7"
description = "DotMac Deployment Control — desired deployment intent, immutable plans, approval-gated rollouts, authenticated target acknowledgements and drift reconciliation for licensed deployments (ADR-0057 § 3)"
authors = ["DotMac"]
readme = "README.md"
packages = [{ include = "dotmac_deployment_control", from = "src" }]
include = [
    { path = "src/dotmac_deployment_control/py.typed", format = ["sdist", "wheel"] },
    { path = "src/dotmac_deployment_control/migrations/**/*", format = ["sdist", "wheel"] },
    # The browser surface's templates, as PACKAGE DATA.
    #
    # Not optional and not decoration: `WebSurfaceContribution` declares a
    # `TemplatePackage` whose root the kernel's registry checks with `is_dir()`
    # at composition, so a wheel that shipped the Python and not this directory
    # would import cleanly and then refuse to compose — the same class of
    # failure as `0.1.0a5`'s floor, discovered at the consumer's container boot
    # rather than here. `scripts/artifact_canaries.py` proves the directory is
    # present in the BUILT artifact rather than in this tree.
    { path = "src/dotmac_deployment_control/templates/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# The one runtime dependency (ADR-0006 § 2). Notably NOT `dotmac-licensing`,
# `dotmac-release-catalog`, `dotmac-approvals` or `dotmac-integration`: every one
# of those couplings is cut at a value in `ports.py`, which is what makes this
# module independently releasable and what the `Modules are independent of each
# other` import-linter contract enforces.
#
# Notably also NOT any provider client, HTTP library or crypto library. This
# module emits a provider-neutral intent and never performs I/O; signature
# verification is `dotmac_kernel.licensing`'s (ADR-0007) and the caller runs it.
#
# THE FLOOR IS THE HIGHEST SYMBOL THIS MODULE IMPORTS, and through `0.1.0a5` it
# was not. It was the ALLOCATION — a76 carries this module's `mod_deploy` ledger
# row, and no earlier kernel can register the module at all
# (`NamespaceRegistry.from_manifests` raises `UnallocatedNamespaceError`) — plus
# a one-alpha margin. The two declared request-time prerequisites are older
# still (`idempotency_ledger.v1` in a66, `platform_audit_log.v1` in a68);
# `dotmac_kernel.transactions`, which `service.py:73` imports, first shipped in
# a98 and set this floor through `0.1.0a6`.
#
# Every one of those is a real lower bound and none of them is THE lower bound
# any more. `database_catalog.py` reads `from
# dotmac_kernel.product_database_catalog import ...`, and
# `dotmac_kernel/product_database_catalog.py` — the contract a module uses to
# publish the exact tables and columns it owns, so that a descriptor can attest
# to structure rather than only to a migration head — FIRST SHIPPED IN a100.
# a99 does not contain the module at all, so `import dotmac_deployment_control`
# raises `ModuleNotFoundError` there.
#
# `0.1.0a5` declared a floor 21 alphas below the one it needed. The artifact was
# byte-perfect and independently verified on seven properties, and it still
# could not be composed: the Platform CP lane resolved a kernel inside the
# declared range, wrote a clean lock, matched the published hashes exactly, and
# died at container boot. A hash proves you got the published bytes. It cannot
# prove they import.
#
# So the floor is the import, and it is FALSIFIABLE IN BOTH DIRECTIONS rather
# than argued: `ci.yml`'s floor lane installs the built wheel with EXACTLY this
# version of the kernel and runs the canaries, which fails if the floor is too
# low; and the mutation lane installs the newest kernel this floor EXCLUDES —
# a99 — and requires the same canaries to fail NAMING the submodule
# `scripts/kernel_floor.py symbol` derives from these imports, which fails if
# the floor is too high or if some unrelated breakage stood in for the proof.
# Raising or lowering this literal without moving the symbol it tracks turns one
# of those two lanes red.
dotmac-kernel = { version = ">=0.1.0a100", source = "forgejo" }
sqlalchemy = "^2.0"

# ── Resolution only: this does NOT enter the published wheel ────────────────
#
# In the repository this package came from, `dotmac-kernel` resolved as a path
# dependency inside the workspace. Standing alone it must come from the private
# index, so the source is declared here and the dependency above points at it.
#
# `priority = "explicit"` matters: without it every dependency in the tree would
# be looked up on the private index first, which is both slower and a way for a
# public package name to be shadowed by a private one of the same name. Explicit
# means "only the dependencies that name this source come from it".
#
# What Poetry writes into the built wheel is the version constraint alone —
# `Requires-Dist: dotmac-kernel (>=0.1.0a100)`. A source is a resolution
# instruction, not package metadata, so adding it does not change the published
# contract and does not require a version bump.
[[tool.poetry.source]]
name = "forgejo"
url = "https://registry.dotmac.io/api/packages/dotmac/pypi/simple/"
priority = "explicit"

# Never shipped: Poetry excludes non-main groups from the built distribution,
# and `test_the_wheel_ships_no_test_or_dev_content` proves it rather than
# trusting it.
[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "0.6.9"
mypy = "^1.11"
# The platform canary talks to a real PostgreSQL. psycopg is a DEV dependency
# and must never become a runtime one: this module performs no I/O.
psycopg = { version = "^3.2", extras = ["binary"] }
# DEV ONLY, and the distinction is the contract — the same one the kernel draws.
#
# Starlette's `Request.form()` asserts `python-multipart` is importable BEFORE it
# inspects the content type, so even a `application/x-www-form-urlencoded` body
# needs it present. The browser surface reads forms exactly as the kernel's own
# platform surface does, and the kernel deliberately does not depend on this
# either: form parsing is an ASSEMBLY concern, and the composing assembly
# supplies it (the vendor control plane pins `python-multipart` itself).
#
# It is here because this repository's own tests drive this module's surface
# with real requests. A runtime dependency would make every consumer of a
# module that performs no I/O carry a body parser it may never use.
python-multipart = "^0.0.20"
# DEV ONLY, and the distinction is the contract. A module's migration is
# executed by the HOST's Alembic — the module declares the lineage and never
# runs it — so `alembic` must not become a runtime dependency of this package.
# It is here because the canary applies the composed lineage to a real database
# and because mypy needs the `alembic.op` stubs to check the migration.
alembic = "^1.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S", "RUF"]
ignore = [
    "S101",  # asserts are the point in tests
]

[tool.ruff.lint.per-file-ignores]
# S608 — the canary drives a real database with literal SQL on purpose: it is
# proving what the DATABASE refuses, which cannot be expressed through the ORM
# the service layer would use.
#
# S105/S106 — the release-workflow guard holds secret NAMES as constants
# (`FORGEJO_PUBLISH_TOKEN`) so it can assert where they may and may not appear.
# Ruff reads any string assigned to a token-ish name as a possible credential.
# These are the names, never the values; no secret value exists anywhere in this
# repository, which is what `test_the_publish_credential_never_appears_in_a_url`
# is for.
#
# S108 — `test_artifact_canaries.py` asserts that the workflows run the canaries
# with `/tmp/canary/bin/python` and `/tmp/consumer/bin/python`. Those literals
# are the PATHS THE WORKFLOWS USE, quoted so the assertion can compare them; the
# test creates no temporary file of its own. Ruff reads any `/tmp` string as a
# temp-file hazard, which is right in general and wrong for a text comparison.
"tests/**" = ["S608", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

# The module is held to a FULLY TYPED contract: it ships `py.typed`, so a
# consuming assembly's type-checker treats these annotations as the contract.
[[tool.mypy.overrides]]
module = "dotmac_deployment_control.*"
disallow_untyped_defs = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
